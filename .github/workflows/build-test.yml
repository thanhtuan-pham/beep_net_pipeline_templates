name: Build And Test Project

on:
  workflow_call:
    inputs:
      results-path:
        required: true
        type: string

    secrets:
      BEEP_GLOBAL_USER:
        required: false
      BEEP_GLOBAL_PASSWORD:
        required: false
      BEEP_GLOBAL_TEST_USER:
        required: false
      BEEP_GLOBAL_TEST_PASSWORD:
        required: false
      BEEP_LOCAL_TEST_USER:
        required: false
      BEEP_LOCAL_TEST_PASSWORD:
        required: false

jobs:

 services-email:
    name: Services email
    runs-on: ubuntu-latest
    
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    
  ci-build-test:
    name: Deploy to CI
    needs: services-email
    runs-on: ubuntu-latest
  
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test Unit Tests
        run: |
          find . -name "*.Tests.Unit.csproj" | xargs -I {} -P 4 sh -c '
            echo "Testing {}"
            dotnet test "{}" \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=test-results.trx"
          '

      - name: Test Integration Tests
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BEEP_GLOBAL_USER: ${{ secrets.BEEP_GLOBAL_USER }}
          BEEP_GLOBAL_PASSWORD: ${{ secrets.BEEP_GLOBAL_PASSWORD }}
          BEEP_GLOBAL_TEST_USER: ${{ secrets.BEEP_GLOBAL_TEST_USER }}
          BEEP_GLOBAL_TEST_PASSWORD: ${{ secrets.BEEP_GLOBAL_TEST_PASSWORD }}
          BEEP_LOCAL_TEST_USER: ${{ secrets.BEEP_LOCAL_TEST_USER }}
          BEEP_LOCAL_TEST_PASSWORD: ${{ secrets.BEEP_LOCAL_TEST_PASSWORD }}
        run: |
          find . -name "*.Tests.Integration.csproj" | xargs -I {} -P 4 sh -c '
            echo "Testing {}"
            dotnet test "{}" \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=test-results.trx"
          '

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: ${{ inputs.results-path }}
