name: Build And Test Project

on:
  workflow_call:
    inputs:
      results-path:
        description: "Path/pattern for test result files"
        required: true
        type: string

      version:
        description: "Package/release version"
        required: true
        type: string

      solution-path:
        description: "Solution or project path"
        required: false
        type: string
        default: ""

      runs-on:
        description: "Runner to use for deployment jobs"
        required: false
        type: string
        default: "ubuntu-latest"

      use-mail-service:
        description: "Start Mailpit for tests"
        required: false
        type: boolean
        default: false

    secrets:
      NUGET_KEY:
        required: true

      SNYK_TOKEN:
        required: true

      BEEP_GLOBAL_USER:
        required: false

      BEEP_GLOBAL_PASSWORD:
        required: false

      BEEP_GLOBAL_TEST_USER:
        required: false

      BEEP_GLOBAL_TEST_PASSWORD:
        required: false

      BEEP_LOCAL_TEST_USER:
        required: false

      BEEP_LOCAL_TEST_PASSWORD:
        required: false

permissions:
  contents: write


# ============================================================
# Jobs
# ============================================================

jobs:

  # ==========================================================
  # CI / Build / Test / Snyk
  # ==========================================================

  ci-build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: DEV

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # .NET
      # --------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet restore "${{ inputs.solution-path }}"
          else
            dotnet restore
          fi


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet build \
              "${{ inputs.solution-path }}" \
              --no-restore
          else
            dotnet build --no-restore
          fi


      # --------------------------------------------------------
      # Mailpit
      # --------------------------------------------------------

      - name: Start Mailpit
        if: inputs.use-mail-service
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Mailpit..."

          docker run -d \
            --name mailpit \
            -p 1025:1025 \
            -p 8025:8025 \
            axllent/mailpit:latest

          echo "Waiting for Mailpit to become ready..."

          for i in {1..30}; do
            if curl -fsS \
              http://localhost:8025/api/v1/info \
              >/dev/null 2>&1; then

              echo "Mailpit is ready."
              exit 0
            fi

            echo "Waiting for Mailpit... attempt $i/30"
            sleep 1
          done

          echo "ERROR: Mailpit failed to start."

          docker logs mailpit || true

          exit 1


      # --------------------------------------------------------
      # Unit Tests
      # --------------------------------------------------------

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p TestResults

          PROJECTS=$(find . -name "*.Tests.Unit.csproj" -print)

          if [ -z "$PROJECTS" ]; then
            echo "No unit test projects found."
            exit 0
          fi

          while IFS= read -r PROJECT; do

            echo ""
            echo "========================================"
            echo "Testing: $PROJECT"
            echo "========================================"

            PROJECT_NAME=$(basename "$PROJECT" .csproj)

            dotnet test "$PROJECT" \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=${PROJECT_NAME}.trx" \
              --results-directory "./TestResults"

          done <<< "$PROJECTS"


      # --------------------------------------------------------
      # Integration Tests
      #
      # Currently runs only for version tags.
      # --------------------------------------------------------

      - name: Run Integration Tests
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BEEP_GLOBAL_USER: ${{ secrets.BEEP_GLOBAL_USER }}
          BEEP_GLOBAL_PASSWORD: ${{ secrets.BEEP_GLOBAL_PASSWORD }}
          BEEP_GLOBAL_TEST_USER: ${{ secrets.BEEP_GLOBAL_TEST_USER }}
          BEEP_GLOBAL_TEST_PASSWORD: ${{ secrets.BEEP_GLOBAL_TEST_PASSWORD }}
          BEEP_LOCAL_TEST_USER: ${{ secrets.BEEP_LOCAL_TEST_USER }}
          BEEP_LOCAL_TEST_PASSWORD: ${{ secrets.BEEP_LOCAL_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p TestResults

          PROJECTS=$(find . -name "*.Tests.Integration.csproj" -print)

          if [ -z "$PROJECTS" ]; then
            echo "No integration test projects found."
            exit 0
          fi

          while IFS= read -r PROJECT; do

            echo ""
            echo "========================================"
            echo "Testing: $PROJECT"
            echo "========================================"

            PROJECT_NAME=$(basename "$PROJECT" .csproj)

            dotnet test "$PROJECT" \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=${PROJECT_NAME}.trx" \
              --results-directory "./TestResults"

          done <<< "$PROJECTS"


      # --------------------------------------------------------
      # Publish Test Results
      # --------------------------------------------------------


      # --------------------------------------------------------
      # Snyk
      # --------------------------------------------------------

      - name: Install Snyk
        run: npm install -g snyk@latest


      - name: Snyk Code Scan
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if find . \
            \( \
              -name "*.js" \
              -o -name "*.ts" \
              -o -name "*.py" \
            \) \
            -print -quit | grep -q .; then

            echo "JavaScript/TypeScript/Python files detected."
            echo "Running Snyk Code scan..."

            snyk code test

          else

            echo "No JavaScript, TypeScript, or Python files found."
            echo "Skipping Snyk Code scan."

          fi
        continue-on-error: true


      - name: Snyk Monitor
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          snyk monitor --all-projects
        continue-on-error: true


      # --------------------------------------------------------
      # Mailpit Cleanup
      # --------------------------------------------------------

      - name: Stop Mailpit
        if: always() && inputs.use-mail-service
        shell: bash
        run: |
          echo "Stopping Mailpit..."

          docker stop mailpit 2>/dev/null || true
          docker rm mailpit 2>/dev/null || true

          echo "Mailpit stopped."


  # ==========================================================
  # Deploy to Test
  # ==========================================================

  deploy-test:
    name: Deploy to Test
    needs: ci-build-test
    runs-on: ${{ inputs.runs-on }}
    environment: Test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Add your Test deployment steps here.
      #
      # Example:
      #
      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Deploy
      #   ...
      # --------------------------------------------------------

      - name: Test deployment placeholder
        shell: bash
        run: |
          echo "Test deployment goes here."


  # ==========================================================
  # Pre-release / NuGet
  #
  # Runs when the workflow is NOT triggered by a version tag.
  # ==========================================================

  deploy-prerelease:
    name: Publish Pre-release
    needs: deploy-test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ inputs.runs-on }}
    environment: PROD

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # .NET
      # --------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      # --------------------------------------------------------
      # Check existing release
      # --------------------------------------------------------

      - name: Check Release Exists
        id: check_release
        uses: insightsengineering/release-existence-action@v1
        with:
          release-tag: v${{ inputs.version }}


      # --------------------------------------------------------
      # Create GitHub Pre-release
      # --------------------------------------------------------

      - name: Create Pre-release
        if: steps.check_release.outputs.release-exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "v${{ inputs.version }}" \
            --title "Pre Release v${{ inputs.version }}" \
            --prerelease \
            --generate-notes


      # --------------------------------------------------------
      # Restore
      # --------------------------------------------------------

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet restore "${{ inputs.solution-path }}"
          else
            dotnet restore
          fi


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet build \
              "${{ inputs.solution-path }}" \
              --configuration Release \
              --no-restore
          else
            dotnet build \
              --configuration Release \
              --no-restore
          fi


      # --------------------------------------------------------
      # Pack NuGet
      # --------------------------------------------------------

      - name: Pack NuGet package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p nupkgs

          if [ -n "${{ inputs.solution-path }}" ]; then

            dotnet pack \
              "${{ inputs.solution-path }}" \
              --configuration Release \
              --no-build \
              --output nupkgs/ \
              /p:Version=${{ inputs.version }}

          else

            dotnet pack \
              --configuration Release \
              --no-build \
              --output nupkgs/ \
              /p:Version=${{ inputs.version }}

          fi


      # --------------------------------------------------------
      # Publish NuGet
      # --------------------------------------------------------

      - name: Publish NuGet package
        shell: bash
        run: |
          set -euo pipefail

          dotnet nuget push \
            "nupkgs/*.nupkg" \
            --api-key "${{ secrets.NUGET_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate


  # ==========================================================
  # Production Release / NuGet
  #
  # Runs when the workflow is triggered by a version tag.
  # ==========================================================

  deploy-release:
    name: Publish Release
    needs: deploy-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ inputs.runs-on }}
    environment: PROD

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # .NET
      # --------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      # --------------------------------------------------------
      # Check existing release
      # --------------------------------------------------------

      - name: Check Release Exists
        id: check_release
        uses: insightsengineering/release-existence-action@v1
        with:
          release-tag: v${{ inputs.version }}


      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create Release
        if: steps.check_release.outputs.release-exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "v${{ inputs.version }}" \
            --title "Release v${{ inputs.version }}" \
            --generate-notes


      # --------------------------------------------------------
      # Restore
      # --------------------------------------------------------

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet restore "${{ inputs.solution-path }}"
          else
            dotnet restore
          fi


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet build \
              "${{ inputs.solution-path }}" \
              --configuration Release \
              --no-restore
          else
            dotnet build \
              --configuration Release \
              --no-restore
          fi


      # --------------------------------------------------------
      # Pack NuGet
      # --------------------------------------------------------

      - name: Pack NuGet package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p nupkgs

          if [ -n "${{ inputs.solution-path }}" ]; then

            dotnet pack \
              "${{ inputs.solution-path }}" \
              --configuration Release \
              --no-build \
              --output nupkgs/ \
              /p:Version=${{ inputs.version }}

          else

            dotnet pack \
              --configuration Release \
              --no-build \
              --output nupkgs/ \
              /p:Version=${{ inputs.version }}

          fi


      # --------------------------------------------------------
      # Publish NuGet
      # --------------------------------------------------------

      - name: Publish NuGet package
        shell: bash
        run: |
          set -euo pipefail

          dotnet nuget push \
            "nupkgs/*.nupkg" \
            --api-key "${{ secrets.NUGET_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
