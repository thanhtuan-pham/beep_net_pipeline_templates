name: Create Azure Resources

# Naming convention:
# beep-[location]-azure-[environment]-[type]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

      location:
        description: 'Azure location'
        required: true
        default: 'southeastasia'
        type: choice
        options:
          - southeastasia
          - westeurope
          - francecentral

      web_app_name:
        description: 'Web App name'
        required: true
        default: 'beep-sa-azure-development-app'

      web_app_runtime:
        description: 'Web App runtime stack'
        required: true
        default: 'DOTNETCORE:8.0'

      sql_db_name:
        description: 'SQL Database name'
        required: true
        default: 'beep-sa-azure-development-db'

      is_linux:
        description: 'Use Linux-based App Service Plan?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: string

      location:
        description: 'Azure location'
        required: true
        type: string

      web_app_name:
        description: 'Web App name'
        required: true
        type: string

      web_app_runtime:
        description: 'Web App runtime stack'
        required: true
        type: string

      sql_db_name:
        description: 'SQL Database name'
        required: true
        type: string

      is_linux:
        description: 'Use Linux-based App Service Plan?'
        required: true
        type: string


jobs:
  create-resources:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------------
      # Environment / naming
      # ------------------------------------------------------------------

      - name: Set Environment Variables
        shell: bash
        run: |
          set -euo pipefail

          LOCATION=$(echo "${{ inputs.location }}" | tr '[:upper:]' '[:lower:]')
          ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          RUNTIME_LOWER=$(echo "${{ inputs.web_app_runtime }}" | tr '[:upper:]' '[:lower:]')
          IS_LINUX=$(echo "${{ inputs.is_linux }}" | tr '[:upper:]' '[:lower:]')

          case "$LOCATION" in
            southeastasia)
              LOCATION_SHORT="sa"
              ;;
            francecentral)
              LOCATION_SHORT="fc"
              ;;
            westeurope)
              LOCATION_SHORT="we"
              ;;
            *)
              echo "ERROR: Unsupported Azure location: $LOCATION"
              exit 1
              ;;
          esac

          if [ "$IS_LINUX" = "true" ]; then
            OS_TYPE="linux"
          else
            OS_TYPE="windows"
          fi

          RESOURCE_GROUP="beep-${LOCATION_SHORT}-azure-${ENV_LOWER}-rg"
          APP_SERVICE_PLAN="beep-${LOCATION_SHORT}-azure-${ENV_LOWER}-${OS_TYPE}-plan"
          SQL_SERVER="beep-${LOCATION_SHORT}-azure-${ENV_LOWER}-sql-server"
          SQL_ADMIN_USER="beep-${LOCATION_SHORT}-azure-${ENV_LOWER}-sql-server-admin"

          LOCATION_SHORT_UPPER=$(echo "$LOCATION_SHORT" | tr '[:lower:]' '[:upper:]')
          ENV_UPPER=$(echo "$ENV_LOWER" | tr '[:lower:]' '[:upper:]')

          AZURE_CREDENTIALS_NAME="BEEP_${LOCATION_SHORT_UPPER}_AZURE_${ENV_UPPER}_CREDENTIALS"
          PLAN_SKU_SECRET_NAME="BEEP_${LOCATION_SHORT_UPPER}_AZURE_${ENV_UPPER}_PLAN_SKU"
          SQL_ADMIN_USER_PASSWORD="BEEP_${LOCATION_SHORT_UPPER}_AZURE_${ENV_UPPER}_SQL_SERVER_ADMIN_PASSWORD"
          SQL_ADMIN_USER_ENTRA_NAME="BEEP_${LOCATION_SHORT_UPPER}_AZURE_${ENV_UPPER}_SQL_SERVER_ADMIN_ENTRA"

          {
            echo "LOCATION=$LOCATION"
            echo "LOCATION_SHORT=$LOCATION_SHORT"
            echo "ENV_LOWER=$ENV_LOWER"
            echo "IS_LINUX=$IS_LINUX"
            echo "RUNTIME_LOWER=$RUNTIME_LOWER"
            echo "OS_TYPE=$OS_TYPE"

            echo "RESOURCE_GROUP=$RESOURCE_GROUP"
            echo "APP_SERVICE_PLAN=$APP_SERVICE_PLAN"
            echo "WEB_APP_NAME=${{ inputs.web_app_name }}"
            echo "SQL_SERVER=$SQL_SERVER"
            echo "SQL_DB=${{ inputs.sql_db_name }}"
            echo "SQL_ADMIN_USER=$SQL_ADMIN_USER"

            echo "AZURE_CREDENTIALS_NAME=$AZURE_CREDENTIALS_NAME"
            echo "PLAN_SKU_SECRET_NAME=$PLAN_SKU_SECRET_NAME"
            echo "SQL_ADMIN_USER_PASSWORD=$SQL_ADMIN_USER_PASSWORD"
            echo "SQL_ADMIN_USER_ENTRA_NAME=$SQL_ADMIN_USER_ENTRA_NAME"
          } >> "$GITHUB_ENV"

          echo "Location:        $LOCATION"
          echo "Environment:     $ENV_LOWER"
          echo "Location short:  $LOCATION_SHORT"
          echo "OS:              $OS_TYPE"
          echo "Resource Group:  $RESOURCE_GROUP"
          echo "App Service Plan: $APP_SERVICE_PLAN"
          echo "Web App:         ${{ inputs.web_app_name }}"
          echo "SQL Server:      $SQL_SERVER"
          echo "SQL Database:    ${{ inputs.sql_db_name }}"


      # ------------------------------------------------------------------
      # Validation
      # ------------------------------------------------------------------

      - name: Validate and Normalize Runtime
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="${{ inputs.web_app_runtime }}"
          RUNTIME_LOWER=$(echo "$RUNTIME" | tr '[:upper:]' '[:lower:]')
          IS_LINUX="${{ inputs.is_linux }}"

          echo "Validating App Service runtime..."
          echo "  Input runtime: $RUNTIME"
          echo "  OS: $([ "$IS_LINUX" = "true" ] && echo "Linux" || echo "Windows")"

          if [ "$IS_LINUX" = "true" ]; then

            echo "Linux App Service Plan selected."

            # Normalize .NET runtime for Linux
            case "$RUNTIME_LOWER" in
              dotnetcore:*)
                VERSION="${RUNTIME_LOWER#dotnetcore:}"
                RUNTIME_NORMALIZED="DOTNETCORE:${VERSION}"
                ;;

              dotnet:*)
                VERSION="${RUNTIME_LOWER#dotnet:}"
                RUNTIME_NORMALIZED="DOTNETCORE:${VERSION}.0"
                ;;

              node:*|python:*|java:*)
                RUNTIME_NORMALIZED="$RUNTIME"
                ;;

              *)
                RUNTIME_NORMALIZED="$RUNTIME"
                ;;
            esac

          elif [ "$IS_LINUX" = "false" ]; then

            echo "Windows App Service Plan selected."

            # Normalize .NET runtime for Windows
            case "$RUNTIME_LOWER" in
              dotnetcore:*)
                VERSION="${RUNTIME_LOWER#dotnetcore:}"

                # Convert 8.0 -> 8
                VERSION_MAJOR="${VERSION%%.*}"

                RUNTIME_NORMALIZED="DOTNET:${VERSION_MAJOR}"

                echo "  Converted Linux .NET runtime '$RUNTIME'"
                echo "  to Windows runtime '$RUNTIME_NORMALIZED'"
                ;;

              dotnet:*)
                VERSION="${RUNTIME_LOWER#dotnet:}"

                # Convert 8.0 -> 8 if supplied
                VERSION_MAJOR="${VERSION%%.*}"

                RUNTIME_NORMALIZED="DOTNET:${VERSION_MAJOR}"
                ;;

              node:*|python:*|java:*)
                echo "ERROR: $RUNTIME is not supported by this Windows configuration."
                echo "Choose a Windows-compatible .NET runtime such as DOTNET:8."
                exit 1
                ;;

              *)
                RUNTIME_NORMALIZED="$RUNTIME"
                ;;
            esac

          else

            echo "ERROR: Invalid is_linux value: '$IS_LINUX'"
            echo "Expected 'true' or 'false'."
            exit 1

          fi

          echo ""
          echo "Runtime configuration:"
          echo "  Input:      $RUNTIME"
          echo "  Normalized: $RUNTIME_NORMALIZED"

          echo "RUNTIME_NORMALIZED=$RUNTIME_NORMALIZED" >> "$GITHUB_ENV"

          echo "✓ Runtime compatibility validated."


      # ------------------------------------------------------------------
      # Azure authentication
      # ------------------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets[env.AZURE_CREDENTIALS_NAME] }}


      # ------------------------------------------------------------------
      # Resource Group
      # ------------------------------------------------------------------

      - name: Create Resource Group
        shell: bash
        run: |
          set -euo pipefail

          if az group show \
            --name "${{ env.RESOURCE_GROUP }}" \
            >/dev/null 2>&1; then

            echo "Resource group already exists: ${{ env.RESOURCE_GROUP }}"

          else

            az group create \
              --name "${{ env.RESOURCE_GROUP }}" \
              --location "${{ env.LOCATION }}"

            echo "Resource group created: ${{ env.RESOURCE_GROUP }}"

          fi


      # ------------------------------------------------------------------
      # App Service Plan
      # ------------------------------------------------------------------

      - name: Create App Service Plan
        shell: bash
        env:
          PLAN_SKU: ${{ secrets[env.PLAN_SKU_SECRET_NAME] }}
        run: |
          set -euo pipefail

          if [ -z "${PLAN_SKU:-}" ]; then
            echo "PLAN_SKU secret not set. Using F1."
            PLAN_SKU="F1"
          fi

          echo "=========================================="
          echo "App Service Plan Configuration"
          echo "=========================================="
          echo "Plan:       ${{ env.APP_SERVICE_PLAN }}"
          echo "OS Type:    ${{ env.OS_TYPE }}"
          echo "IS_LINUX:   ${{ env.IS_LINUX }}"
          echo "SKU:        $PLAN_SKU"
          echo "=========================================="

          if az appservice plan show \
            --name "${{ env.APP_SERVICE_PLAN }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            >/dev/null 2>&1; then

            echo "App Service Plan already exists."

          else

            if [ "${{ env.IS_LINUX }}" = "true" ]; then

              echo "Creating LINUX App Service Plan..."

              az appservice plan create \
                --name "${{ env.APP_SERVICE_PLAN }}" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --location "${{ env.LOCATION }}" \
                --sku "$PLAN_SKU" \
                --is-linux true

            elif [ "${{ env.IS_LINUX }}" = "false" ]; then

              echo "Creating WINDOWS App Service Plan..."

              az appservice plan create \
                --name "${{ env.APP_SERVICE_PLAN }}" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --location "${{ env.LOCATION }}" \
                --sku "$PLAN_SKU" \
                --is-linux false

            else

              echo "ERROR: Invalid IS_LINUX value: '${{ env.IS_LINUX }}'"
              exit 1

            fi

          fi

          echo ""
          echo "Verifying App Service Plan..."

          az appservice plan show \
            --name "${{ env.APP_SERVICE_PLAN }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "{name:name, kind:kind, isLinux:reserved, sku:sku.name, tier:sku.tier}" \
            --output json


      # ------------------------------------------------------------------
      # Web App
      # ------------------------------------------------------------------

      - name: Create Web App
        shell: bash
        run: |
          set -euo pipefail

          if az webapp show \
            --name "${{ env.WEB_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            >/dev/null 2>&1; then

            echo "Web App already exists: ${{ env.WEB_APP_NAME }}"
            exit 0
          fi

          az webapp create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --plan "${{ env.APP_SERVICE_PLAN }}" \
            --name "${{ env.WEB_APP_NAME }}" \
            --runtime "${{ env.RUNTIME_NORMALIZED }}"

          echo "Web App created: ${{ env.WEB_APP_NAME }}"


      # ------------------------------------------------------------------
      # SQL Server
      # ------------------------------------------------------------------

      - name: Create SQL Server
        shell: bash
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets[env.SQL_ADMIN_USER_PASSWORD] }}
        run: |
          set -euo pipefail

          if az sql server show \
            --name "${{ env.SQL_SERVER }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            >/dev/null 2>&1; then

            echo "SQL Server already exists: ${{ env.SQL_SERVER }}"
            exit 0
          fi

          if [ -z "${SQL_ADMIN_PASSWORD:-}" ]; then
            echo "ERROR: SQL administrator password secret is empty."
            exit 1
          fi

          az sql server create \
            --name "${{ env.SQL_SERVER }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --location "${{ env.LOCATION }}" \
            --admin-user "${{ env.SQL_ADMIN_USER }}" \
            --admin-password "$SQL_ADMIN_PASSWORD"

          echo "SQL Server created: ${{ env.SQL_SERVER }}"


      # ------------------------------------------------------------------
      # SQL Server Microsoft Entra Administrator
      # ------------------------------------------------------------------

      - name: Set Entra ID Admin for SQL Server
        shell: bash
        env:
          ENTRA_ADMIN_NAME: ${{ secrets[env.SQL_ADMIN_USER_ENTRA_NAME] }}
        run: |
          set -euo pipefail

          if [ -z "${ENTRA_ADMIN_NAME:-}" ]; then
            echo "INFO: Entra admin secret is not configured."
            echo "Skipping Entra ID administrator configuration."
            exit 0
          fi

          echo "Resolving Entra ID administrator..."

          OBJECT_ID=""

          # First try user lookup.
          if OBJECT_ID=$(az ad user show \
            --id "$ENTRA_ADMIN_NAME" \
            --query id \
            --output tsv 2>/dev/null); then

            echo "Entra user found."

          # Then try group lookup.
          elif OBJECT_ID=$(az ad group show \
            --group "$ENTRA_ADMIN_NAME" \
            --query id \
            --output tsv 2>/dev/null); then

            echo "Entra group found."

          else

            echo "ERROR: Could not resolve Entra ID object: $ENTRA_ADMIN_NAME"
            echo ""
            echo "If using a UPN, verify:"
            echo "  - The UPN exists in the same Entra tenant."
            echo "  - The GitHub Actions service principal has Microsoft Graph User.Read.All."
            echo "  - Admin consent has been granted."
            echo ""
            echo "If using a group, verify:"
            echo "  - The group exists in the same Entra tenant."
            echo "  - The service principal has Microsoft Graph Group.Read.All."
            echo ""
            exit 1

          fi

          if [ -z "$OBJECT_ID" ]; then
            echo "ERROR: Entra ID object ID is empty."
            exit 1
          fi

          echo "Entra ID object resolved successfully."

          az sql server ad-admin create \
            --server "${{ env.SQL_SERVER }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --display-name "$ENTRA_ADMIN_NAME" \
            --object-id "$OBJECT_ID"

          echo "Entra ID administrator configured successfully."


      # ------------------------------------------------------------------
      # SQL Database
      # ------------------------------------------------------------------

      - name: Create SQL Database
        shell: bash
        run: |
          set -euo pipefail

          if az sql db show \
            --name "${{ env.SQL_DB }}" \
            --server "${{ env.SQL_SERVER }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            >/dev/null 2>&1; then

            echo "SQL Database already exists: ${{ env.SQL_DB }}"
            exit 0
          fi

          if [ "${{ env.ENV_LOWER }}" = "production" ]; then

            echo "Creating production SQL Database..."

            az sql db create \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --server "${{ env.SQL_SERVER }}" \
              --name "${{ env.SQL_DB }}" \
              --edition GeneralPurpose \
              --compute-model Provisioned \
              --family Gen5 \
              --capacity 2 \
              --backup-storage-redundancy Zone

          else

            echo "Creating development SQL Database using Azure SQL free offer..."

            az sql db create \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --server "${{ env.SQL_SERVER }}" \
              --name "${{ env.SQL_DB }}" \
              --edition GeneralPurpose \
              --compute-model Serverless \
              --family Gen5 \
              --capacity 2 \
              --backup-storage-redundancy Local \
              --use-free-limit

          fi

          echo "SQL Database created: ${{ env.SQL_DB }}"


      # ------------------------------------------------------------------
      # Output
      # ------------------------------------------------------------------

      - name: Output Resource Information
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "Azure resources created successfully"
          echo "=========================================="
          echo ""
          echo "Environment:     ${{ env.ENV_LOWER }}"
          echo "Location:        ${{ env.LOCATION }}"
          echo "Resource Group:  ${{ env.RESOURCE_GROUP }}"
          echo "App Service Plan:${{ env.APP_SERVICE_PLAN }}"
          echo "Web App:         ${{ env.WEB_APP_NAME }}"
          echo "Web App URL:     https://${{ env.WEB_APP_NAME }}.azurewebsites.net"
          echo "SQL Server:      ${{ env.SQL_SERVER }}.database.windows.net"
          echo "SQL Database:    ${{ env.SQL_DB }}"
          echo ""