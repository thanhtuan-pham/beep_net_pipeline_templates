name: Build And Test Project

on:
  workflow_call:
    inputs:
      results-path:
        required: true
        type: string
        
      version:
        required: true
        type: string
        
      solution-path:
        required: false
        type: string
        default: ''
             
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
        
    secrets:
      NUGET_KEY:
        required: true  
        
      SNYK_TOKEN:
        required: true  
jobs:  
          
  # === CI and Unit Tests ===
  ci-build-test:   
    name: Deploy to CI
    runs-on: ubuntu-latest
    environment: DEV
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test Unit Tests
      env:
          BEEP_GLOBAL_USER: global
          BEEP_GLOBAL_PASSWORD: 1
          BEEP_GLOBAL_TEST_USER: global
          BEEP_GLOBAL_TEST_PASSWORD: 1
          BEEP_LOCAL_TEST_USER: local
          BEEP_LOCAL_TEST_PASSWORD: 1
      run: |
          find . -name "*.Tests.Unit.csproj" | xargs -I {} -P 4 sh -c '
            echo "Testing {}"
            dotnet test "{}" --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
          '
    - name: Test Integration Tests
      if: startsWith(github.ref, 'refs/tags/v')
      env:
          BEEP_GLOBAL_USER: global
          BEEP_GLOBAL_PASSWORD: 1
          BEEP_GLOBAL_TEST_USER: global
          BEEP_GLOBAL_TEST_PASSWORD: 1
          BEEP_LOCAL_TEST_USER: local
          BEEP_LOCAL_TEST_PASSWORD: 1
      run: |
          find . -name "*.Tests.Integration.csproj" | xargs -I {} -P 4 sh -c '
            echo "Testing {}"
            dotnet test "{}" --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
          '
          
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: (!cancelled())
      with:
        files: ${{ inputs.results-path }}
        
    - name: Install Snyk
      run: npm install -g snyk@latest

    - name: Authenticate
      run: snyk auth ${{ secrets.SNYK_TOKEN }}

    - name: Scan dependencies
      run: snyk test --all-projects
          
    - name: Scan code
      run: snyk code test
      
    - name: Monitor project on Snyk 
      run: snyk monitor --all-projects    
      
  # === Deployment to Test ===
  deploy-test:
    name: Deploy to Test
    needs: ci-build-test
    runs-on: ${{ inputs.runs-on }}
    environment: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
          
  # === Deployment to Production ===    
  deploy-prerelease:
    name: Publish for untag
    needs: deploy-test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ inputs.runs-on }}
    environment: PROD 
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
        
    #- name: Check Release Exists
    #  id: check_release
    #  uses: insightsengineering/release-existence-action@v1
    #  with:
    #    release-tag: v${{ inputs.version }}
        
    - name: Check Release Exists
      id: check_release
      uses: actions/github-script@v7
      with:
          script: |
            const tag = `v${{ inputs.version }}`;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
              } else {
                throw error;
              }
            }

    
    - name: Create Pre Release
      if: steps.check_release.outputs.exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ inputs.version  }}"
        release_name: "Pre Release v${{ inputs.version }}"
        draft: false
        prerelease: true
          
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution-path }}
    - name: Build
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ inputs.version }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json

  # === Deployment to Production ===    
  deploy-release:
    name: Publish for tag
    needs: deploy-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ inputs.runs-on }}
    environment: PROD 
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
                  
    - name: Check Release Exists
      id: check_release
      uses: insightsengineering/release-existence-action@v1
      with:
        release-tag: v${{ inputs.version }}
        
    - name: Create Release
      if: steps.check_release.outputs.release-exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ inputs.version  }}"
        release_name: "Release v${{ inputs.version }}"
        draft: false
        prerelease: false
        
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution-path }}
    - name: Build
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ inputs.version }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json
