name: Build And Test Project

on:
  workflow_call:

    inputs:

      results-path:
        description: "Path/pattern for test result files"
        required: true
        type: string

      version:
        description: "Package/release version"
        required: true
        type: string

      solution-path:
        description: "Solution or project path"
        required: false
        type: string
        default: ""

      publish-nuget-path:
        description: "Solution or project path"
        required: false
        type: string
        default: ""
        
      runs-on:
        description: "Runner for deployment jobs"
        required: false
        type: string
        default: "ubuntu-latest"

      call-publish-nuget:
        description: "Call publish-nuget workflow"
        required: true
        type: boolean
        default: true

      call-deploy:
        description: "Call deploy workflow"
        required: true
        type: boolean
        default: false
        
      prefix-tag:
        required: false   
        type: string
        default: "v"
        
    secrets:

      BEEP_NUGET_KEY:
        required: true

      BEEP_SNYK_TOKEN:
        required: false

      BEEP_GLOBAL_USER:
        required: false

      BEEP_GLOBAL_PASSWORD:
        required: false

      BEEP_GLOBAL_TEST_USER:
        required: false

      BEEP_GLOBAL_TEST_PASSWORD:
        required: false

      BEEP_LOCAL_TEST_USER:
        required: false

      BEEP_LOCAL_TEST_PASSWORD:
        required: false

      AZURE_CREDENTIALS:
        required: false


permissions:
  contents: write
  issues: read
  checks: write
  pull-requests: write
  security-events: write


jobs:

  # ==========================================================
  # BUILD AND TEST
  # ==========================================================

  ci-build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: DEV

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup .NET
      # --------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      # --------------------------------------------------------
      # Restore
      # --------------------------------------------------------

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet restore "${{ inputs.solution-path }}"
          else
            dotnet restore
          fi


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.solution-path }}" ]; then
            dotnet build \
              "${{ inputs.solution-path }}" \
              --no-restore
          else
            dotnet build \
              --no-restore
          fi


      # ========================================================
      # UNIT TESTS
      # ========================================================

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p TestResults

          PROJECTS=$(find . -name "*.Tests.Unit*.csproj" -print)

          if [ -z "$PROJECTS" ]; then
            echo "No unit test projects found."
            exit 0
          fi

          while IFS= read -r PROJECT; do

            echo "Testing: $PROJECT"

            PROJECT_NAME=$(basename "$PROJECT" .csproj)

            dotnet test "$PROJECT" \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=${PROJECT_NAME}.trx" \
              --results-directory "./TestResults"

          done <<< "$PROJECTS"


      # ========================================================
      # INTEGRATION TESTS
      # ========================================================

      - name: Run Integration Tests
        if: startsWith(github.ref, format('refs/tags/{0}', inputs.prefix-tag))
        env:
          BEEP_GLOBAL_USER: ${{ secrets.BEEP_GLOBAL_USER }}
          BEEP_GLOBAL_PASSWORD: ${{ secrets.BEEP_GLOBAL_PASSWORD }}
          BEEP_GLOBAL_TEST_USER: ${{ secrets.BEEP_GLOBAL_TEST_USER }}
          BEEP_GLOBAL_TEST_PASSWORD: ${{ secrets.BEEP_GLOBAL_TEST_PASSWORD }}
          BEEP_LOCAL_TEST_USER: ${{ secrets.BEEP_LOCAL_TEST_USER }}
          BEEP_LOCAL_TEST_PASSWORD: ${{ secrets.BEEP_LOCAL_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p TestResults

          PROJECTS=$(find . -name "*.Tests.Integration.csproj" -print)

          if [ -z "$PROJECTS" ]; then
            echo "No integration test projects found."
            exit 0
          fi

          while IFS= read -r PROJECT; do

            echo "Testing: $PROJECT"

            PROJECT_NAME=$(basename "$PROJECT" .csproj)

            dotnet test "$PROJECT" \
              --no-build \
              --verbosity normal \
              --logger "trx;LogFileName=${PROJECT_NAME}.trx" \
              --results-directory "./TestResults"

          done <<< "$PROJECTS"


      # ========================================================
      # TEST RESULTS
      # ========================================================

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ${{ inputs.results-path }}

      # ==========================================================
      # PUBLISH NUGET
  #
  # Tag v*     -> Production Release
  # Other ref  -> Pre-release
  # ==========================================================

  publish:
    name: Publish NuGet
    needs: ci-build-test

    if: |
      inputs.call-publish-nuget &&
      always() &&
      needs.ci-build-test.result == 'success'

    uses: thanhtuan-pham/beep_net_pipeline_templates/.github/workflows/beep-nuget.yml@main

    with:
      version: ${{ inputs.version }}
      solution-path: ${{ inputs.publish-nuget-path }}
      prefix-tag: ${{ inputs.prefix-tag }}
      prerelease: ${{ !startsWith(github.ref, format('refs/tags/{0}', inputs.prefix-tag)) }}

    secrets:
      NUGET_KEY: ${{ secrets.BEEP_NUGET_KEY }}


  # ==========================================================
  # DEPLOY
  # ==========================================================

  deploy-ci:
    name: Deploy to CI
    needs: ci-build-test
    if: inputs.call-deploy

    uses: thanhtuan-pham/beep_net_pipeline_templates/.github/workflows/beep-deploy.yml@main

    with:
      environment: CI
      infrastructure: Azure
      runs-on: ${{ inputs.runs-on }}

  deploy-test:
    name: Deploy to Test
    needs: deploy-ci
    if: inputs.call-deploy

    uses: thanhtuan-pham/beep_net_pipeline_templates/.github/workflows/beep-deploy.yml@main

    with:
      environment: TEST
      infrastructure: Azure
      runs-on: ${{ inputs.runs-on }}
