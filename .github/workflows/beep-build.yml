name: Build And Test Project

on:
  workflow_call:
    inputs:
      results-path:
        required: true
        type: string
        
      version:
        required: true
        type: string
        
      solution-path:
        required: false
        type: string
        default: ''
             
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
        
    secrets:
      NUGET_KEY:
        required: true   
        
jobs:  
          
  # === CI and Unit Tests ===
  ci-build-test:   
    name: Deploy to CI
    runs-on: ubuntu-latest
    environment: DEV
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: (!cancelled())
      with:
        files: ${{ inputs.results-path }}
          
  # === Deployment to Test ===
  deploy-test:
    name: Deploy to Test
    needs: ci-build-test
    runs-on: ${{ inputs.runs-on }}
    environment: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
          
  # === Deployment to Production ===    
  deploy-prerelease:
    name: Publish for untag
    needs: deploy-test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ inputs.runs-on }}
    environment: PROD 
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Check Release Exists
      id: check_release
      uses: insightsengineering/release-existence-action@v1
      with:
        release-tag: v${{ inputs.version }}
        
    - name: Create Pre Release
      if: steps.check_release.outputs.release-exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ inputs.version  }}"
        release_name: "Pre Release v${{ inputs.version }}"
        draft: false
        prerelease: true
          
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution-path }}
    - name: Build
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ inputs.version }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json

  # === Deployment to Production ===    
  deploy-release:
    name: Publish for tag
    needs: deploy-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ inputs.runs-on }}
    environment: PROD 
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
                  
    - name: Check Release Exists
      id: check_release
      uses: insightsengineering/release-existence-action@v1
      with:
        release-tag: v${{ inputs.version }}
        
    - name: Create Release
      if: steps.check_release.outputs.release-exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ inputs.version  }}"
        release_name: "Release v${{ inputs.version }}"
        draft: false
        prerelease: false
        
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution-path }}
    - name: Build
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ inputs.version }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json
