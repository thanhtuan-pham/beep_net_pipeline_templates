name: Build And Test Project

on:
  workflow_call:
    inputs:
      results-path:
        required: true
        type: string
        
      solution-path:
        required: false
        type: string
        default: ''
        
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
        
    secrets:
      NUGET_KEY:
        required: true   
        
jobs:  
          
  # === CI and Unit Tests ===
  ci-build-test:   
    name: Deploy to CI
    runs-on: ubuntu-latest
    environment: DEV
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: (!cancelled())
      with:
        files: ${{ inputs.results-path }}
          
  # === Deployment to Test ===
  deploy-test:
    name: Deploy to Test
    needs: ci-build-test
    runs-on: ${{ inputs.runs-on }}
    environment: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
          
  # === Deployment to Production ===    
  deploy-prerelease:
    name: Publish for untag
    needs: deploy-test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ inputs.runs-on }}
    environment: PROD 
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
                  
    - name: Check for tags using git
      id: check_tags
      run: |
          TAGS=$(git tag --list)
          if [ -z "$TAGS" ]; then
            echo "::set-output name=has_tags::false"
          else
            echo "::set-output name=has_tags::true"
          fi   
          
    - name: Find latest tag
      if: steps.check_tags.outputs.has_tags == 'true'
      id: find_latest_tag
      uses: oprypin/find-latest-tag@v1
      with:
          repository: ${{ github.repository }}
          releases-only: false
          prefix: "v"
          
    - name: Get latest tag
      id: latest_tag
      run: |
          if [[ "${{ steps.check_tags.outputs.has_tags }}" == "true" ]]; then
              echo "latest_tag=${{ steps.find_latest_tag.outputs.tag }}" >> $GITHUB_OUTPUT
            else
              echo "latest_tag=v0.0.0" >> $GITHUB_OUTPUT
            fi
      
    - name: Check tag pre release
      id: check_tag_pre_release
      if: contains(steps.latest_tag.outputs.latest_tag, 'build')
      run: echo "check=true" >> $GITHUB_OUTPUT
        
    - name: Calculate new version
      id: calculate_new_version
      run: |
            LAST_TAG=${{ steps.latest_tag.outputs.latest_tag }}
            VERSION_CORE=$(echo $LAST_TAG | sed 's/^v//')

            if [[ "${{ steps.check_tag_pre_release.outputs.check }}" == "true" ]]; then
              NEW_VERSION_CORE=$(echo $VERSION_CORE | awk -F'.' -v OFS='.' '{$NF = $NF + 1;}1')
              echo "new_version=$NEW_VERSION_CORE" >> $GITHUB_OUTPUT
            else
              echo "new_version=$VERSION_CORE-build.1" >> $GITHUB_OUTPUT
            fi
            
    - name: Check Release Exists
      id: check_release
      uses: insightsengineering/release-existence-action@v1
      with:
        release-tag: v${{ steps.calculate_new_version.outputs.new_version }}   
        
    - name: Create Pre Release
      if: steps.check_release.outputs.release-exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ steps.calculate_new_version.outputs.new_version  }}"
        release_name: "Pre Release v${{ steps.calculate_new_version.outputs.new_version }}"
        draft: false
        prerelease: true
          
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution-path }}
    - name: Build
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ steps.calculate_new_version.outputs.new_version }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json

  # === Deployment to Production ===    
  deploy-release:
    name: Publish for tag
    needs: deploy-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ inputs.runs-on }}
    environment: PROD 
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
          
    - name: Get tag
      id: tag
      uses: dawidd6/action-get-tag@v1
      with:
        strip_v: true
        
    - name: Check Release Exists
      id: check_release
      uses: insightsengineering/release-existence-action@v1
      with:
        release-tag: v${{ steps.tag.outputs.tag }}
        
    - name: Create Release
      if: steps.check_release.outputs.release-exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ steps.tag.outputs.tag  }}"
        release_name: "Release v${{ steps.tag.outputs.tag }}"
        draft: false
        prerelease: false
        
    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution-path }}
    - name: Build
      run: dotnet build ${{ inputs.solution-path }} --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ steps.tag.outputs.tag }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json
