name: Publish Pre Release

on:
  workflow_call:
    inputs:
      environment_name:
            description: 'Name of the environment to deploy to'
            required: true
            type: string
            
      new_version:
        required: false
        type: string
        
      solution-path:
        required: false
        type: string
        default: ''
        
    secrets:
      NUGET_KEY:
        required: true   
        
jobs:  
  publish-pre-release:
    name: Publish Pre Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          fetch-depth: 0 
          
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
                        
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Pack NuGet package
      run: dotnet pack ${{ inputs.solution-path }} --configuration Release --no-build --output nupkgs/ /p:Version=${{ inputs.new_version }}
    - name: Publish NuGet package
      run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_KEY  }} --source https://api.nuget.org/v3/index.json
